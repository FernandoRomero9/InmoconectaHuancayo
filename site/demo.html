<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<title>Inmoconecta CRM · Demo</title>
<meta name="description" content="Demo funcional del CRM propuesto por Kallari para Inmoconecta Huancayo: leads de compra y venta, derivación por perfil de asesor, seguimiento, captación y stock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/demo.css">
<script src="assets/theme.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Menú principal">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">i</div>
      <div>
        <div class="brand-name">Inmoconecta</div>
        <div class="brand-sub">CRM · Huancayo</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me">
        <span class="avatar">AL</span>
        <div><b>Alberto</b><span>Bróker · Administrador</span></div>
      </div>
      <a class="side-link" href="index.html">← Volver a la propuesta</a>
      <div class="made-by"><span>Desarrollado por</span><img src="assets/kallari-logo.png" width="123" height="43" alt="Kallari"></div>
    </div>
  </aside>

  <div class="main">
    <div class="demo-banner" role="note">
      <span><b>Demo de Kallari con datos de ejemplo.</b><span class="hide-sm"> Nombres, teléfonos y cifras son ficticios; los cambios se guardan solo en este navegador.</span></span>
      <button type="button" id="reset-demo">Reiniciar</button>
    </div>
    <header class="top">
      <div class="top-titles">
        <h1 id="page-title">Inicio</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="top-actions">
        <div class="search hide-sm">
          <span id="search-ic"></span>
          <input id="global-search" type="search" placeholder="Buscar lead o código…" autocomplete="off" aria-label="Buscar">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <button type="button" class="live-toggle hide-sm" id="live-toggle" title="Entra un lead simulado cada 45 segundos" aria-pressed="false"><span class="live-dot"></span><span>En vivo</span></button>
        <button class="btn sm hide-sm" id="sim-lead" type="button">Simular lead</button>
        <button type="button" class="theme-toggle" data-theme-toggle></button>
        <button class="btn primary sm" id="new-lead-top" type="button"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav" aria-label="Navegación"></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dr-title"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/demo-data.js"></script>
<script src="assets/demo-app.js"></script>
</body>
</html>
